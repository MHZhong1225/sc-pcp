# Exact finite-MDP theorem-validation setting.  The active method remains
# SC-PCP; exact ratios and oracle-L1 quantities are internal diagnostics only.
data:
  dataset: tabular
synthetic:
  feedback_strength: 1.0
model:
  hidden_dim: 64
  representation_dim: 16
  batch_size: 512
  epochs: 40
  patience: 6
policy:
  tilt: 1.0
  temperature: 1.0
  action_costs: [0.0, 0.05, 0.10]
  policy_ratio_cap: 1.1
cot:
  hidden_dims: [64, 32]
  batch_size: 512
  epochs: 40
  patience: 6
  rho_cap: 1.1
  weight_cap: 1.22
  q_samples_per_batch: 4
  loss: huber
samples:
  logged: 10000
  oracle_rollouts: 50000
  oracle_surface_rollouts: 1000
  online_rollouts: 1000
baselines:
  mfcs_depth: 3
  aci_gamma: 0.01
  multidim_buffer: 1000
  online_rounds: 3
  prc_maximum_step: 0.35
paper:
  save_mechanism_diagonal: false
horizon: 12
q_grid_size: 101
q_quantile_min: 0.50
q_quantile_max: 0.999
certification:
  alpha: 0.10
  delta: 0.05
  ratio_bound_source: none
  practical_bootstrap_resamples: 2000
output_dir: results/work/profiled_ordered_tabular_validation
seeds:
  start: 0
  stop: 200
devices: [cuda:0, cuda:1]
