protocol: native_synthetic_signed_gamma_v1

dgp:
  initial_difficulty_probability: 0.25
  logging_exploration: 0.12
  radius_low: 1.70
  radius_high: 2.10
  response_sigmoid_slope: 4.0
  policy_tilt: 0.4
  policy_ratio_cap: 3.0
  difficulty_intercept: -1.60
  difficulty_persistence: 2.00
  difficulty_state_effect: 0.25
  gamma_difficulty_coefficient: 0.35
  tail_intercept: -3.20
  tail_difficulty_effect: 2.20
  gamma_tail_coefficient: 0.45
  tail_scale: 3.0
  outcome_correlation: 0.30
  state_clip: 8.0

gate:
  radius_mid: 1.90
  radius_high: 2.10
  minimum_mid_policy_tv: 0.03
  minimum_high_policy_tv: 0.05
  maximum_mid_action_coordinate_shift: -0.03
  maximum_high_action_coordinate_shift: -0.05
  minimum_late_difficulty_shift: 0.01
  minimum_late_tail_shift: 0.01
  minimum_prefix_ess_fraction: 0.15
  maximum_incremental_ratio: 3.0
  maximum_normalized_weight_share: 0.02
  minimum_available_seed_fraction: 0.95

horizon: 12
late_stage_start: 4
mechanism_trajectories: 50000
gammas: [-4.0, -2.0, 0.0, 2.0, 4.0]
primary_gamma: -4.0

# The runner audits this namespace against prior actual use and coordinated
# external reservations before it creates the output root.  No checked-in
# PASS flag or digest can authorize execution.
base_seeds:
  - 121000
  - 121010
  - 121020
  - 121030
  - 121040
  - 121050
  - 121060
  - 121070
  - 121080
  - 121090
  - 121100
  - 121110
  - 121120
  - 121130
  - 121140
  - 121150
  - 121160
  - 121170
  - 121180
  - 121190
seed_namespace: native_synthetic_signed_gamma_v1:121000..121190:step10
rng_audit_policy: live_actual_use_v1

devices: [cuda:0, cuda:1]
output_root: results/work/native_synthetic_signed_gamma_v1

# Frozen future science budgets. The preflight runner never consumes them.
calibration_trajectories: 3000
grid_trajectories: 1000
reference_trajectories: 20000
online_trajectories: 2000
bootstrap_resamples: 10000
