data:
  dataset: mimic_cxr
  data_root: /home/ubuntu/zmh/dataset
  cache_dir: data/real_cache
  max_patients: 60000
  cohort_seed: 271828
  empirical_neighbors: 100
  empirical_bandwidth: 2.0
  empirical_embedding_dim: 32
  cxr_encoder: densenet121
  cxr_embedding_dim: 256
  cxr_epochs: 3
  cxr_batch_size: 32
model:
  architecture: gru
  history_length: 4
  hidden_dim: 128
  representation_dim: 32
policy:
  tilt: 1.0
  temperature: 1.0
  # none / non-invasive oxygen or ventilation / invasive ventilation
  action_costs: [0.0, 0.06, 0.10]
  propensity_floor: 0.01
  policy_ratio_cap: 10.0
cot:
  rho_cap: 4.0
  weight_cap: 40.0
  loss: huber
  q_samples_per_batch: 4
certification:
  alpha: 0.10
  delta: 0.05
  ratio_bound_source: none
  practical_bootstrap_resamples: 2000
samples:
  oracle_rollouts: 50000
  online_rollouts: 2000
baselines:
  mfcs_depth: 3
  aci_gamma: 0.01
  multidim_buffer: 1000
  online_rounds: 3
  prc_maximum_step: 0.35
paper:
  save_mechanism_diagonal: false
horizon: 6
q_grid_size: 101
q_quantile_min: 0.50
q_quantile_max: 0.999
seeds:
  start: 0
  stop: 20
devices: [cuda:0, cuda:1]
output_dir: results/work/paper_v2/rq1/mimic_cxr
