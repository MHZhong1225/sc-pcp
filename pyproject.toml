[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scpcp"
version = "0.1.0"
description = "Self-Consistent Performative Conformal Prediction"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "torch>=2.4",
]

[project.optional-dependencies]
research = [
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.0",
  "pyarrow>=16.0",
  "Pillow>=10.0",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "torchvision>=0.19",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/per_step"]
pythonpath = ["src"]
addopts = "-ra"
